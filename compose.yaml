services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8765
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
